<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chizish Taxtasi | Drawing App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Asboblar paneli */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #0f172a;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 14px;
            color: #94a3b8;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #334155;
            border-radius: 50%;
        }

        input[type="range"] {
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #475569;
        }

        .btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-clear {
            background: #ef4444;
        }

        .btn-clear:hover {
            background: #dc2626;
        }

        .btn-save {
            background: #10b981;
        }

        .btn-save:hover {
            background: #059669;
        }

        /* Canvas chizish maydoni */
        canvas {
            background: #ffffff;
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>

    <h1>Interaktiv Chizish Taxtasi</h1>

    <div class="app-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <label for="colorPicker">Rang:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="tool-group">
                <label for="brushSize">Qalinlik (<span id="sizeVal">5</span>px):</label>
                <input type="range" id="brushSize" min="1" max="50" value="5">
            </div>

            <div class="tool-group">
                <button class="btn active" id="brushBtn">Mo'yqalam</button>
                <button class="btn" id="eraserBtn">O'chirg'ich</button>
            </div>

            <div class="tool-group">
                <button class="btn btn-clear" id="clearBtn">Tozalash</button>
                <button class="btn btn-save" id="saveBtn">Yuklab olish (.png)</button>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="paintCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("paintCanvas");
        const ctx = canvas.getContext("2d");

        const colorPicker = document.getElementById("colorPicker");
        const brushSize = document.getElementById("brushSize");
        const sizeVal = document.getElementById("sizeVal");
        const brushBtn = document.getElementById("brushBtn");
        const eraserBtn = document.getElementById("eraserBtn");
        const clearBtn = document.getElementById("clearBtn");
        const saveBtn = document.getElementById("saveBtn");

        let isDrawing = false;
        let isEraser = false;
        let currentColor = "#000000";
        let currentSize = 5;

        // Boshlang'ich doska fonini oq qilish (saqlashda shaffof bo'lib qolmasligi uchun)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Chizishni boshlash
        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        // Chizishni tugatish
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Chizish jarayoni
        function draw(e) {
            if (!isDrawing) return;

            // Sichqoncha yoki sensor koordinatalarini olish
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineWidth = currentSize;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (isEraser) {
                ctx.strokeStyle = "#ffffff";
            } else {
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Event Listeners (Sichqoncha)
        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseleave", stopDrawing);

        // Touch events (Mobil va planshetlar uchun)
        canvas.addEventListener("touchstart", startDrawing);
        canvas.addEventListener("touchend", stopDrawing);
        canvas.addEventListener("touchmove", draw);

        // Sozlamalar
        colorPicker.addEventListener("input", (e) => {
            currentColor = e.target.value;
            if (isEraser) setBrush();
        });

        brushSize.addEventListener("input", (e) => {
            currentSize = e.target.value;
            sizeVal.textContent = currentSize;
        });

        function setBrush() {
            isEraser = false;
            brushBtn.classList.add("active");
            eraserBtn.classList.remove("active");
        }

        function setEraser() {
            isEraser = true;
            eraserBtn.classList.add("active");
            brushBtn.classList.remove("active");
        }

        brushBtn.addEventListener("click", setBrush);
        eraserBtn.addEventListener("click", setEraser);

        // Doskani tozalash
        clearBtn.addEventListener("click", () => {
            if (confirm("Butun doskani tozalamoqchimisiz?")) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        // Rasmni PNG shaklida yuklab olish
        saveBtn.addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = "mening-rasmim.png";
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
